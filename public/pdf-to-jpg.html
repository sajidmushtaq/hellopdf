<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF to JPG - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=910" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="mobile-header">
  <button class="mobile-menu-btn" id="toolsMenuBtn" type="button">☰</button>
  <a href="/index.html" class="mobile-logo">HelloPDF</a>
  <button class="mobile-grid-btn" id="mainMenuBtn" type="button">⠿</button>
</header>

<section class="tool-page">
  <div class="tool-box">

    <div class="tool-icon">
      <i class="fa-solid fa-file-image" style="color:#f97316;font-size:55px;"></i>
    </div>

    <h1>PDF to JPG</h1>
    <p class="tool-description">Convert PDF pages into high quality JPG images.</p>

    <form id="uploadForm">
      <div class="drop-zone" id="dropZone">
        <p>Click or Drag & Drop PDF Here</p>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>

      <div id="fileList"></div>

      <button type="submit">Convert to JPG</button>
    </form>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

  </div>
</section>

<script src="/js/pdf-to-jpg.js?v=1"></script>

</body>
</html>
