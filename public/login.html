<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=1037" />
</head>
<body>

  <div class="auth-page">

    <div class="auth-card" id="loginCard">
      <a href="/index.html" class="auth-logo">HelloPDF</a>

      <h1>Welcome back</h1>
      <p>Login to continue using your PDF tools.</p>
      <div class="social-auth">
  <button type="button" class="social-btn google-btn" id="googleLoginBtn">
    <i class="fa-brands fa-google"></i>
    Continue with Google
  </button>

  <button type="button" class="social-btn facebook-btn" id="facebookLoginBtn">
    <i class="fa-brands fa-facebook-f"></i>
    Continue with Facebook
  </button>

  <div class="auth-divider">
    <span>OR</span>
  </div>
</div>
      <form class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address" required />
        <input type="password" id="loginPassword" placeholder="Password" required />

        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p id="authMessage" style="margin-top:14px;font-size:14px;"></p>

      <p class="auth-switch">
        Don’t have an account?
        <a href="/signup.html">Sign up</a>
      </p>
    </div>

    <div class="auth-card" id="successCard" style="display:none;">
      <a href="/index.html" class="auth-logo">HelloPDF</a>

      <div style="
        width:110px;
        height:110px;
        border:6px solid #22c55e;
        border-radius:50%;
        margin:20px auto 28px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#22c55e;
        font-size:58px;
        font-weight:700;
      ">
        ✓
      </div>

      <h1>You have been successfully logged in</h1>
      <p id="welcomeText">Welcome back to HelloPDF!</p>

      <a href="/index.html" style="
        display:inline-block;
        margin-top:22px;
        background:#ef4444;
        color:white;
        padding:14px 24px;
        border-radius:9px;
        text-decoration:none;
        font-weight:800;
      ">
        Start using HelloPDF
      </a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://vfpgxiepllmkfkdtyjws.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0NR6JL7RbGq9hHQMXCUbzA_MSU2Vh1T";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById("loginForm");
    const authMessage = document.getElementById("authMessage");
    const loginBtn = document.getElementById("loginBtn");
    const loginCard = document.getElementById("loginCard");
    const successCard = document.getElementById("successCard");
    const welcomeText = document.getElementById("welcomeText");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      authMessage.style.color = "#64748b";
      authMessage.textContent = "Logging in...";
      loginBtn.disabled = true;
      loginBtn.textContent = "Please wait...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

      if (error) {
        authMessage.style.color = "#ef4444";
        authMessage.textContent = error.message;
        return;
      }

      const user = data.user;
      const fullName =
        user.user_metadata?.full_name ||
        user.email ||
        "User";

      localStorage.setItem("hellopdf_user_email", user.email || "");
      localStorage.setItem("hellopdf_user_name", fullName);

      welcomeText.textContent = "Welcome back to HelloPDF, " + fullName + "!";

      loginCard.style.display = "none";
      successCard.style.display = "block";

      setTimeout(() => {
        window.location.href = "/index.html";
      }, 1800);
    });
const googleLoginBtn = document.getElementById("googleLoginBtn");
const facebookLoginBtn = document.getElementById("facebookLoginBtn");

googleLoginBtn.addEventListener("click", async () => {

  await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/index.html"
    }
  });

});

facebookLoginBtn.addEventListener("click", async () => {

  await supabaseClient.auth.signInWithOAuth({
    provider: "facebook",
    options: {
      redirectTo: window.location.origin + "/index.html"
    }
  });

});
  </script>

</body>
</html>
