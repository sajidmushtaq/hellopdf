<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Protect PDF - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=910" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="mobile-header">
  <button class="mobile-menu-btn" id="toolsMenuBtn" type="button">☰</button>
  <a href="/index.html" class="mobile-logo">HelloPDF</a>
  <button class="mobile-grid-btn" id="mainMenuBtn" type="button">⠿</button>
</header>

<section class="tool-page">
  <div class="tool-box">

    <div class="tool-icon">
      <i class="fa-solid fa-lock" style="color:#dc2626;font-size:55px;"></i>
    </div>

    <h1>Protect PDF</h1>
    <p class="tool-description">Add password protection and secure your PDF document.</p>

    <form id="uploadForm">
      <div class="drop-zone" id="dropZone">
        <p>Click or Drag & Drop PDF Here</p>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>

      <div id="fileList"></div>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
        required
        style="margin-top:15px;padding:14px;width:100%;max-width:360px;border:1px solid #cbd5e1;border-radius:12px;"
      >

      <button type="submit">Protect PDF</button>
    </form>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

  </div>
</section>

<script src="/js/protect.js?v=1"></script>

</body>
</html>
