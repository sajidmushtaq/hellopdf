<!DOCTYPE html>
<html>
<head>
  <title>Add Watermark</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  
</header>

<section class="tools-section">



<form id="uploadForm">

  <div class="drop-zone" id="dropZone">
    <p>Click or Drag & Drop PDF</p>
    <input type="file" id="fileInput" accept="application/pdf" hidden>
  </div>

  <div id="fileList"></div>

  <!-- TEXT -->
  <input type="text" id="text" placeholder="Enter watermark text" required>

  <!-- SIZE -->
  <label>Size:</label>
  <input type="range" id="size" min="10" max="80" value="30">

  <!-- OPACITY -->
  <label>Opacity:</label>
  <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.5">

  <br><br>

  <button type="submit">Add Watermark</button>

</form>

<div class="progress-container">
  <div class="progress-bar" id="progressBar">0%</div>
</div>

</section>

<script src="js/watermark.js"></script>
<script src="js/header.js"></script>
</body>
</html>
</body>
</html>
