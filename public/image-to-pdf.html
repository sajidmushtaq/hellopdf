<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Image to PDF - HelloPDF</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <div class="tool-page">
    <div class="tool-box">

      <div class="tool-icon">
        <i class="fa-solid fa-images" style="color:#22c55e;"></i>
      </div>

      <h1>Image to PDF</h1>
      <p>Convert JPG, JPEG, and PNG images into a single PDF file.</p>

      <form id="imageToPdfForm">

        <label class="upload-area" for="imageFiles">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span id="fileName">Select images</span>
          <input
            type="file"
            id="imageFiles"
            name="images"
            accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            multiple
            hidden
          />
        </label>

        <button type="submit" class="main-btn">
          Convert to PDF
        </button>

      </form>

      <p id="statusText"></p>

    </div>
  </div>

  <script>
    const form = document.getElementById("imageToPdfForm");
    const fileInput = document.getElementById("imageFiles");
    const fileName = document.getElementById("fileName");
    const statusText = document.getElementById("statusText");

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length === 1) {
        fileName.textContent = fileInput.files[0].name;
      } else if (fileInput.files.length > 1) {
        fileName.textContent = fileInput.files.length + " images selected";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!fileInput.files.length) {
        statusText.textContent = "Please select images first.";
        return;
      }

      const formData = new FormData();

      for (const file of fileInput.files) {
        formData.append("images", file);
      }

      statusText.textContent = "Converting images to PDF...";

      try {
        const response = await fetch("/image-to-pdf", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || "Image to PDF failed");
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "image-to-pdf.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();

        window.URL.revokeObjectURL(url);

        statusText.textContent = "PDF downloaded successfully.";
      } catch (error) {
        console.error(error);
        statusText.textContent = error.message || "Something went wrong.";
      }
    });
  </script>

  <script src="js/header.js"></script>

</body>
</html>
