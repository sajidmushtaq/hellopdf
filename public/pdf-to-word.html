<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF to Word - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=321" />
</head>
<body>

<header class="mobile-header">
  <button class="mobile-menu-btn" id="toolsMenuBtn" type="button">☰</button>
  <a href="/index.html" class="mobile-logo">HelloPDF</a>
  <button class="mobile-grid-btn" id="mainMenuBtn" type="button">⠿</button>
</header>

<section class="tool-page">
  <div class="tool-box">
    <h1>📄 PDF to Word</h1>
    <p>Convert your PDF into editable Word document.</p>

    <form id="uploadForm">
      <label class="drop-zone" id="dropZone" for="fileInput">
        <p>Click or Drag PDF Here</p>
        <input type="file" id="fileInput" accept="application/pdf" hidden />
      </label>

      <div id="fileList"></div>

      <button type="submit">Convert to Word</button>
    </form>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const form = document.getElementById("uploadForm");
  const fileList = document.getElementById("fileList");
  const progressBar = document.getElementById("progressBar");

  let selectedFile = null;

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragging");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragging");
  });

  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragging");

    const file = e.dataTransfer.files[0];
    if (file) {
      handleFile(file);
    }
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (file) {
      handleFile(file);
    }
  });

  function handleFile(file) {
    if (file.type !== "application/pdf") {
      alert("Please select PDF file only");
      return;
    }

    selectedFile = file;
    fileList.innerHTML = `<div>📄 ${file.name}</div>`;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    if (!selectedFile) {
      alert("Please select PDF file first");
      return;
    }

    const formData = new FormData();
    formData.append("pdf", selectedFile);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/pdf-to-word");
    xhr.responseType = "blob";

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressBar.style.width = percent + "%";
        progressBar.innerText = percent + "%";
      }
    };

    xhr.onload = () => {
      if (xhr.status === 200) {
        const blob = xhr.response;
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "converted.docx";
        document.body.appendChild(a);
        a.click();
        a.remove();

        window.URL.revokeObjectURL(url);
      } else {
        alert("Conversion failed");
      }
    };

    xhr.onerror = () => {
      alert("Request failed");
    };

    xhr.send(formData);
  });
});
</script>

</body>
</html>
