<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF to Excel - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=250" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="mobile-header">
  <button class="mobile-menu-btn" id="toolsMenuBtn" type="button">☰</button>
  <a href="/index.html" class="mobile-logo">HelloPDF</a>
  <button class="mobile-grid-btn" id="mainMenuBtn" type="button">⠿</button>
</header>

<div class="tools-drawer" id="toolsDrawer">
  <button class="drawer-close" id="toolsClose" type="button">×</button>

  <h3>PDF Tools</h3>

  <a href="/merge.html">Merge PDF</a>
  <a href="/compress.html">Compress PDF</a>
  <a href="/image-to-pdf.html">Image to PDF</a>
  <a href="/pdf-to-image.html">PDF to Image</a>
  <a href="/split.html">Split PDF</a>
  <a href="/remove.html">Remove Pages</a>
  <a href="/rotate.html">Rotate PDF</a>
  <a href="/watermark.html">Watermark</a>
</div>

<div class="main-drawer" id="mainDrawer">
  <button class="drawer-close" id="mainClose" type="button">×</button>

  <div class="drawer-section">
    <h4>OTHER PRODUCTS</h4>
    <h4>SOLUTIONS</h4>
    <h4>APPLICATIONS</h4>
  </div>

  <a href="#">💳 Pricing</a>
  <a href="#">🔒 Security</a>
  <a href="#">⚙️ Features</a>
  <a href="#">💎 About us</a>

  <div class="drawer-bottom">
    <a href="#">Help ›</a>
    <a href="#">Language ›</a>
    <a href="/login.html" class="drawer-login">Login</a>
    <a href="/signup.html" class="drawer-signup">Sign up</a>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="tool-page">
  <div class="tool-box">

    <div class="tool-icon">
      <i class="fa-solid fa-file-excel"></i>
    </div>

    <h1>PDF to Excel</h1>
    <p>Convert PDF text into an Excel file.</p>

    <form id="pdfToExcelForm">

      <label class="upload-area" for="pdfFile">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span id="fileName">Select PDF file</span>
        <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf" hidden />
      </label>

      <button type="submit" class="main-btn">
        Convert to Excel
      </button>

    </form>

    <p id="statusText"></p>

  </div>
</div>

<script>
  const form = document.getElementById("pdfToExcelForm");
  const fileInput = document.getElementById("pdfFile");
  const fileName = document.getElementById("fileName");
  const statusText = document.getElementById("statusText");

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      fileName.textContent = fileInput.files[0].name;
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!fileInput.files.length) {
      statusText.textContent = "Please select a PDF file first.";
      return;
    }

    const formData = new FormData();
    formData.append("pdfFile", fileInput.files[0]);

    statusText.textContent = "Converting PDF to Excel...";

    try {
      const response = await fetch("/pdf-to-excel", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "PDF to Excel failed");
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "converted.xlsx";
      document.body.appendChild(a);
      a.click();
      a.remove();

      window.URL.revokeObjectURL(url);

      statusText.textContent = "Excel file downloaded successfully.";
    } catch (error) {
      console.error(error);
      statusText.textContent = error.message || "Something went wrong.";
    }
  });

  const toolsBtn = document.getElementById("toolsMenuBtn");
  const mainBtn = document.getElementById("mainMenuBtn");
  const toolsDrawer = document.getElementById("toolsDrawer");
  const mainDrawer = document.getElementById("mainDrawer");
  const overlay = document.getElementById("drawerOverlay");

  function closeDrawers() {
    toolsDrawer.classList.remove("active");
    mainDrawer.classList.remove("active");
    overlay.classList.remove("active");
  }

  toolsBtn.addEventListener("click", () => {
    toolsDrawer.classList.add("active");
    overlay.classList.add("active");
  });

  mainBtn.addEventListener("click", () => {
    mainDrawer.classList.add("active");
    overlay.classList.add("active");
  });

  document.getElementById("toolsClose").addEventListener("click", closeDrawers);
  document.getElementById("mainClose").addEventListener("click", closeDrawers);
  overlay.addEventListener("click", closeDrawers);
</script>

</body>
</html>
