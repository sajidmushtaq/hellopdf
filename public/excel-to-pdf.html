<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Excel to PDF - HelloPDF</title>

  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="tool-page">
  <div class="tool-box">

    <div class="tool-icon">
      <i class="fa-solid fa-file-excel"></i>
    </div>

    <h1>Excel to PDF</h1>
    <p>Convert Excel file into PDF format.</p>

    <form id="excelForm">

      <label class="upload-area" for="excelFile">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span id="fileName">Select Excel file</span>
        <input type="file" id="excelFile" name="excelFile" accept=".xlsx" hidden />
      </label>

      <button type="submit" class="main-btn">
        Convert to PDF
      </button>

    </form>

    <p id="statusText"></p>

  </div>
</div>

<script>
  const form = document.getElementById("excelForm");
  const fileInput = document.getElementById("excelFile");
  const fileName = document.getElementById("fileName");
  const statusText = document.getElementById("statusText");

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      fileName.textContent = fileInput.files[0].name;
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!fileInput.files.length) {
      statusText.textContent = "Please select an Excel file first.";
      return;
    }

    const formData = new FormData();
    formData.append("excelFile", fileInput.files[0]);

    statusText.textContent = "Converting Excel to PDF...";

    try {
      const response = await fetch("/excel-to-pdf", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "Conversion failed");
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "converted.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();

      window.URL.revokeObjectURL(url);

      statusText.textContent = "PDF downloaded successfully.";
    } catch (error) {
      console.error(error);
      statusText.textContent = error.message || "Something went wrong.";
    }
  });
</script>
<script src="js/header.js"></script>
</body>
</html>

</body>
</html>
