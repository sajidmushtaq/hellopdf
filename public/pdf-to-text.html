<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>PDF to Text - HelloPDF</title>

  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="tool-page">
  <div class="tool-box">

    <div class="tool-icon">
      <i class="fa-solid fa-file-lines" style="color:#06b6d4;"></i>
    </div>

    <h1>PDF to Text</h1>
    <p>Extract text from your PDF file.</p>

    <form id="pdfToTextForm">

      <label class="upload-area" for="pdfFile">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span id="fileName">Select PDF file</span>
        <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf" hidden />
      </label>

      <button type="submit" class="main-btn">
        Extract Text
      </button>

    </form>

    <p id="statusText"></p>

  </div>
</div>

<script>
  const form = document.getElementById("pdfToTextForm");
  const fileInput = document.getElementById("pdfFile");
  const fileName = document.getElementById("fileName");
  const statusText = document.getElementById("statusText");

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      fileName.textContent = fileInput.files[0].name;
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!fileInput.files.length) {
      statusText.textContent = "Please select a PDF file first.";
      return;
    }

    const formData = new FormData();
    formData.append("pdfFile", fileInput.files[0]);

    statusText.textContent = "Extracting text...";

    try {
      const response = await fetch("/pdf-to-text", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "Extraction failed");
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "pdf-text.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();

      window.URL.revokeObjectURL(url);

      statusText.textContent = "Text downloaded successfully.";
    } catch (error) {
      console.error(error);
      statusText.textContent = error.message || "Something went wrong.";
    }
  });
</script>
<script src="js/header.js"></script>
</body>
</html>
</body>
</html>
