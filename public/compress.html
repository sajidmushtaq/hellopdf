<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compress PDF - HelloPDF</title>
  <link rel="stylesheet" href="/css/style.css?v=170">
</head>
<body>

<header class="mobile-header">
  <button class="mobile-menu-btn" id="toolsMenuBtn" type="button">☰</button>
  <a href="/index.html" class="mobile-logo">HelloPDF</a>
  <button class="mobile-grid-btn" id="mainMenuBtn" type="button">⠿</button>
</header>
Har page me

<div class="main-drawer" id="mainDrawer">
  <button class="drawer-close" id="mainClose" type="button">×</button>

  <div class="drawer-section">
    <h4>OTHER PRODUCTS</h4>
    <h4>SOLUTIONS</h4>
    <h4>APPLICATIONS</h4>
  </div>

  <a href="#">💳 Pricing</a>
  <a href="#">🔒 Security</a>
  <a href="#">⚙️ Features</a>
  <a href="#">💎 About us</a>

  <div class="drawer-bottom">
    <a href="#">Help ›</a>
    <a href="#">Language ›</a>
    <a href="/login.html" class="drawer-login">Login</a>
    <a href="/signup.html" class="drawer-signup">Sign up</a>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>

<section class="tools-section">
  <form id="uploadForm">
    <div class="drop-zone" id="dropZone">
      <p>Click or Drag & Drop PDF</p>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
    </div>

    <div id="fileList"></div>

    <button type="submit">Compress PDF</button>
  </form>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar">0%</div>
  </div>
</section>

<script src="/js/compress.js"></script>

<script>
  const toolsBtn = document.getElementById("toolsMenuBtn");
  const mainBtn = document.getElementById("mainMenuBtn");
  const toolsDrawer = document.getElementById("toolsDrawer");
  const mainDrawer = document.getElementById("mainDrawer");
  const overlay = document.getElementById("drawerOverlay");

  function closeDrawers() {
    toolsDrawer.classList.remove("active");
    mainDrawer.classList.remove("active");
    overlay.classList.remove("active");
  }

  toolsBtn.addEventListener("click", () => {
    toolsDrawer.classList.add("active");
    overlay.classList.add("active");
  });

  mainBtn.addEventListener("click", () => {
    mainDrawer.classList.add("active");
    overlay.classList.add("active");
  });

  document.getElementById("toolsClose").addEventListener("click", closeDrawers);
  document.getElementById("mainClose").addEventListener("click", closeDrawers);
  overlay.addEventListener("click", closeDrawers);
</script>

</body>
</html>
