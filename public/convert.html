<!-- TOOL PAGE -->
<section class="tool-page">

  <div class="tool-box">

    <h1>🖼 Image to PDF</h1>
    <p>Convert JPG and PNG images into a professional PDF document.</p>

    <form id="uploadForm">

      <div class="drop-zone" id="dropZone">
        <p>Click or Drag Images Here</p>
        <input
          type="file"
          id="fileInput"
          multiple
          accept="image/*"
          hidden
        >
      </div>

      <div id="fileList"></div>

      <button type="submit">Convert to PDF</button>

    </form>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

  </div>

</section>
