<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to PDF - HelloPDF</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f6fa;color:#111827}
.page{min-height:100vh;padding:22px 14px 145px}
h1{text-align:center;font-size:32px;font-weight:900;margin-bottom:8px}
.subtitle{text-align:center;color:#64748b;font-size:14px;line-height:1.5;margin-bottom:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.actions button{height:66px;border:none;border-radius:18px;background:#ef4444;color:white;font-size:16px;font-weight:900}
.actions button:last-child{background:#111827}
.editor{display:none;background:#fff;border-radius:20px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.08);margin-bottom:16px}
.editor.active{display:block}
.canvas-wrap{position:relative;width:100%;height:360px;background:#111827;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%}
.crop-box{position:absolute;border:3px dashed #ef4444;border-radius:10px;pointer-events:none}
.slider-box{margin-top:14px;background:#f8fafc;border-radius:14px;padding:12px}
.slider-box label{display:flex;justify-content:space-between;font-weight:900;font-size:14px;color:#111827;margin-bottom:8px}
.slider-box input{width:100%}
.crop-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.crop-controls button{height:42px;border:none;border-radius:12px;background:#eef2f7;color:#111827;font-weight:900;font-size:14px}
.editor-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.editor-tools button{height:48px;border:none;border-radius:12px;background:#f1f5f9;color:#111827;font-weight:900}
.editor-tools .red{background:#ef4444;color:#fff}
.pages-title{font-size:16px;font-weight:900;margin:12px 0}
.empty{text-align:center;color:#64748b;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:16px;padding:10px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card img{width:100%;height:170px;object-fit:contain;border-radius:12px;background:#f8fafc}
.card span{display:block;font-size:12px;font-weight:800;margin-top:8px;word-break:break-word}
.remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border:none;border-radius:50%;background:#ef4444;color:white;font-size:20px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:white;padding:14px 16px;border-top:1px solid #e5e7eb;box-shadow:0 -10px 30px rgba(0,0,0,.08)}
.create{width:100%;height:62px;border:none;border-radius:16px;background:#ef4444;color:white;font-size:20px;font-weight:900}
.progress{height:22px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px}
.bar{width:0%;height:100%;background:#ef4444;color:white;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.success{display:none;min-height:100vh;text-align:center;padding:120px 20px}
.success.active{display:block}
.icon{width:88px;height:88px;border-radius:50%;background:#22c55e;color:white;font-size:50px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.download{height:62px;padding:0 34px;border:none;border-radius:16px;background:#ef4444;color:white;font-size:20px;font-weight:900}
</style>
</head>

<body>

<main class="page" id="page">
  <h1>Scan to PDF</h1>
  <p class="subtitle">Capture, crop, enhance and convert document photos into a clean PDF.</p>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="galleryInput" accept="image/*" hidden>

  <div class="actions">
    <button id="cameraBtn" type="button">📷<br>Camera</button>
    <button id="galleryBtn" type="button">🖼️<br>Gallery</button>
  </div>

  <section class="editor" id="editor">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="scanCanvas"></canvas>
      <div class="crop-box" id="cropBox"></div>
    </div>

    <div class="slider-box">
      <label>
        <span>Enhancement</span>
        <span id="enhanceValue">0%</span>
      </label>
      <input type="range" id="enhanceSlider" min="0" max="100" value="0">
    </div>

    <div class="crop-controls">
      <button id="cropUp" type="button">↑</button>
      <button id="cropDown" type="button">↓</button>
      <button id="cropLeft" type="button">←</button>
      <button id="cropRight" type="button">→</button>
      <button id="cropSmaller" type="button">− Crop</button>
      <button id="cropBigger" type="button">+ Crop</button>
      <button id="cropTall" type="button">Tall</button>
      <button id="cropWide" type="button">Wide</button>
    </div>

    <div class="editor-tools">
      <button id="rotateBtn" type="button">Rotate</button>
      <button id="bwBtn" type="button">B/W</button>
      <button id="resetBtn" type="button">Reset</button>
      <button id="addPageBtn" class="red" type="button">Add Page</button>
      <button id="cancelBtn" type="button">Cancel</button>
      <button id="fullCropBtn" type="button">Full Crop</button>
    </div>
  </section>

  <div class="pages-title">Scanned Pages</div>
  <div class="empty" id="emptyText">No scanned pages yet.</div>
  <div class="grid" id="imageList"></div>
</main>

<section class="success" id="success">
  <div class="icon">✓</div>
  <h1>PDF Ready</h1>
  <p>Your scanned document is ready.</p>
  <button class="download" id="downloadBtn" type="button">Download PDF</button>
</section>

<div class="bottom" id="bottom">
  <button class="create" id="createBtn" type="button">Create PDF</button>
  <div class="progress">
    <div class="bar" id="progressBar">0%</div>
  </div>
</div>

<script>
const page = document.getElementById("page");
const success = document.getElementById("success");
const bottom = document.getElementById("bottom");

const cameraInput = document.getElementById("cameraInput");
const galleryInput = document.getElementById("galleryInput");
const cameraBtn = document.getElementById("cameraBtn");
const galleryBtn = document.getElementById("galleryBtn");

const editor = document.getElementById("editor");
const canvasWrap = document.getElementById("canvasWrap");
const canvas = document.getElementById("scanCanvas");
const ctx = canvas.getContext("2d");
const cropBox = document.getElementById("cropBox");

const rotateBtn = document.getElementById("rotateBtn");
const bwBtn = document.getElementById("bwBtn");
const resetBtn = document.getElementById("resetBtn");
const addPageBtn = document.getElementById("addPageBtn");
const cancelBtn = document.getElementById("cancelBtn");
const fullCropBtn = document.getElementById("fullCropBtn");

const enhanceSlider = document.getElementById("enhanceSlider");
const enhanceValue = document.getElementById("enhanceValue");

const cropUp = document.getElementById("cropUp");
const cropDown = document.getElementById("cropDown");
const cropLeft = document.getElementById("cropLeft");
const cropRight = document.getElementById("cropRight");
const cropSmaller = document.getElementById("cropSmaller");
const cropBigger = document.getElementById("cropBigger");
const cropTall = document.getElementById("cropTall");
const cropWide = document.getElementById("cropWide");

const imageList = document.getElementById("imageList");
const emptyText = document.getElementById("emptyText");
const createBtn = document.getElementById("createBtn");
const progressBar = document.getElementById("progressBar");
const downloadBtn = document.getElementById("downloadBtn");

let currentImage = null;
let rotation = 0;
let bwMode = false;
let enhanceAmount = 0;

let crop = { x:8, y:8, w:84, h:84 };

let scannedFiles = [];
let outputUrl = null;

cameraBtn.onclick = () => cameraInput.click();
galleryBtn.onclick = () => galleryInput.click();

cameraInput.onchange = e => loadImage(e.target.files[0]);
galleryInput.onchange = e => loadImage(e.target.files[0]);

function loadImage(file){
  if(!file || !file.type.startsWith("image/")){
    alert("Please select an image");
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const img = new Image();

    img.onload = () => {
      currentImage = img;
      rotation = 0;
      bwMode = false;
      enhanceAmount = 0;
      enhanceSlider.value = 0;
      enhanceValue.textContent = "0%";
      crop = { x:8, y:8, w:84, h:84 };
      editor.classList.add("active");
      drawImage();
      updateCropBox();
      window.scrollTo({top:0,behavior:"smooth"});
    };

    img.src = reader.result;
  };

  reader.readAsDataURL(file);

  cameraInput.value = "";
  galleryInput.value = "";
}

function drawImage(){
  if(!currentImage) return;

  const maxW = 1200;
  const scale = Math.min(1, maxW / currentImage.width);
  let w = currentImage.width * scale;
  let h = currentImage.height * scale;

  if(rotation % 180 !== 0){
    canvas.width = h;
    canvas.height = w;
  }else{
    canvas.width = w;
    canvas.height = h;
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.drawImage(currentImage, -w / 2, -h / 2, w, h);
  ctx.restore();

  applyFilters();
}

function applyFilters(){
  const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
  const data = imageData.data;

  const contrast = 1 + (enhanceAmount / 100) * 1.4;
  const brightness = enhanceAmount * 0.8;

  for(let i=0;i<data.length;i+=4){
    let r=data[i], g=data[i+1], b=data[i+2];

    r = ((r - 128) * contrast) + 128 + brightness;
    g = ((g - 128) * contrast) + 128 + brightness;
    b = ((b - 128) * contrast) + 128 + brightness;

    if(bwMode){
      const gray = 0.299*r + 0.587*g + 0.114*b;
      const bw = gray > 150 ? 255 : 0;
      r = g = b = bw;
    }

    data[i] = Math.max(0, Math.min(255, r));
    data[i+1] = Math.max(0, Math.min(255, g));
    data[i+2] = Math.max(0, Math.min(255, b));
  }

  ctx.putImageData(imageData,0,0);
}

function updateCropBox(){
  cropBox.style.left = crop.x + "%";
  cropBox.style.top = crop.y + "%";
  cropBox.style.width = crop.w + "%";
  cropBox.style.height = crop.h + "%";
}

function moveCrop(dx,dy){
  crop.x = Math.max(0, Math.min(100 - crop.w, crop.x + dx));
  crop.y = Math.max(0, Math.min(100 - crop.h, crop.y + dy));
  updateCropBox();
}

function resizeCrop(dw,dh){
  crop.w = Math.max(25, Math.min(100 - crop.x, crop.w + dw));
  crop.h = Math.max(25, Math.min(100 - crop.y, crop.h + dh));
  updateCropBox();
}

enhanceSlider.oninput = () => {
  enhanceAmount = parseInt(enhanceSlider.value,10);
  enhanceValue.textContent = enhanceAmount + "%";
  drawImage();
};

rotateBtn.onclick = () => {
  rotation = (rotation + 90) % 360;
  drawImage();
};

bwBtn.onclick = () => {
  bwMode = !bwMode;
  drawImage();
};

resetBtn.onclick = () => {
  rotation = 0;
  bwMode = false;
  enhanceAmount = 0;
  enhanceSlider.value = 0;
  enhanceValue.textContent = "0%";
  crop = { x:8, y:8, w:84, h:84 };
  drawImage();
  updateCropBox();
};

cancelBtn.onclick = () => {
  editor.classList.remove("active");
};

fullCropBtn.onclick = () => {
  crop = { x:0, y:0, w:100, h:100 };
  updateCropBox();
};

cropUp.onclick = () => moveCrop(0,-4);
cropDown.onclick = () => moveCrop(0,4);
cropLeft.onclick = () => moveCrop(-4,0);
cropRight.onclick = () => moveCrop(4,0);
cropSmaller.onclick = () => resizeCrop(-6,-6);
cropBigger.onclick = () => resizeCrop(6,6);
cropTall.onclick = () => resizeCrop(-4,8);
cropWide.onclick = () => resizeCrop(8,-4);

addPageBtn.onclick = () => {
  if(!currentImage) return;

  const wrapRect = canvasWrap.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();

  const visibleX = canvasRect.left - wrapRect.left;
  const visibleY = canvasRect.top - wrapRect.top;
  const visibleW = canvasRect.width;
  const visibleH = canvasRect.height;

  const cropPixelX = ((crop.x / 100) * wrapRect.width - visibleX) / visibleW * canvas.width;
  const cropPixelY = ((crop.y / 100) * wrapRect.height - visibleY) / visibleH * canvas.height;
  const cropPixelW = (crop.w / 100) * wrapRect.width / visibleW * canvas.width;
  const cropPixelH = (crop.h / 100) * wrapRect.height / visibleH * canvas.height;

  const sx = Math.max(0, cropPixelX);
  const sy = Math.max(0, cropPixelY);
  const sw = Math.min(canvas.width - sx, cropPixelW);
  const sh = Math.min(canvas.height - sy, cropPixelH);

  const croppedCanvas = document.createElement("canvas");
  const croppedCtx = croppedCanvas.getContext("2d");

  croppedCanvas.width = Math.max(1, sw);
  croppedCanvas.height = Math.max(1, sh);

  croppedCtx.drawImage(
    canvas,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    croppedCanvas.width,
    croppedCanvas.height
  );

  croppedCanvas.toBlob(blob => {
    const file = new File([blob], `scan-page-${Date.now()}.jpg`, {
      type:"image/jpeg"
    });

    scannedFiles.push(file);
    renderPages();
    editor.classList.remove("active");
  }, "image/jpeg", 0.92);
};

function renderPages(){
  imageList.innerHTML = "";
  emptyText.style.display = scannedFiles.length ? "none" : "block";

  scannedFiles.forEach((file,index)=>{
    const url = URL.createObjectURL(file);
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <button class="remove" type="button">×</button>
      <img src="${url}">
      <span>${index + 1}. Scanned page</span>
    `;

    card.querySelector(".remove").onclick = () => {
      scannedFiles.splice(index,1);
      URL.revokeObjectURL(url);
      renderPages();
    };

    imageList.appendChild(card);
  });
}

createBtn.onclick = async () => {
  if(!scannedFiles.length){
    alert("Please scan and add at least one page first");
    return;
  }

  const formData = new FormData();
  scannedFiles.forEach(file => formData.append("images", file));

  progressBar.style.width = "20%";
  progressBar.textContent = "20%";
  createBtn.disabled = true;
  createBtn.textContent = "Creating...";

  try{
    const response = await fetch("/scan-to-pdf", {
      method:"POST",
      body:formData
    });

    if(!response.ok){
      alert(await response.text());
      return;
    }

    const blob = await response.blob();

    if(!blob || blob.size < 100){
      alert("PDF creation failed");
      return;
    }

    outputUrl = URL.createObjectURL(blob);
    progressBar.style.width = "100%";
    progressBar.textContent = "100%";

    setTimeout(()=>{
      page.style.display = "none";
      bottom.style.display = "none";
      success.classList.add("active");
      window.scrollTo(0,0);
    },400);

  }catch(err){
    alert("Scan to PDF failed");
  }finally{
    createBtn.disabled = false;
    createBtn.textContent = "Create PDF";
  }
};

downloadBtn.onclick = () => {
  if(!outputUrl){
    alert("PDF not ready");
    return;
  }

  const a = document.createElement("a");
  a.href = outputUrl;
  a.download = "scanned.pdf";
  document.body.appendChild(a);
  a.click();
  a.remove();
};
</script>

</body>
</html>
