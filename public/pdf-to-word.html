<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to Word - HelloPDF</title>
  <link rel="stylesheet" href="/css/style.css?v=999" />
</head>
<body>

<section class="tool-page">
  <div class="tool-box">
    <h1>📄 PDF to Word</h1>
    <p>Convert your PDF into editable Word document.</p>

    <form id="uploadForm">
      <input
        type="file"
        id="fileInput"
        accept="application/pdf"
        style="display:block; margin:20px auto; padding:14px; border:2px solid #94a3b8; border-radius:12px; background:white;"
      />

      <div id="fileList"></div>

      <button type="submit">Convert to Word</button>
    </form>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const fileInput = document.getElementById("fileInput");
  const form = document.getElementById("uploadForm");
  const fileList = document.getElementById("fileList");
  const progressBar = document.getElementById("progressBar");

  let selectedFile = null;

  fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];

    if (selectedFile) {
      fileList.innerHTML = "📄 " + selectedFile.name;
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    if (!selectedFile) {
      alert("Please select PDF file first");
      return;
    }

    const formData = new FormData();
    formData.append("pdf", selectedFile);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/pdf-to-word");
    xhr.responseType = "blob";

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressBar.style.width = percent + "%";
        progressBar.innerText = percent + "%";
      }
    };

    xhr.onload = () => {
      if (xhr.status === 200) {
        const url = window.URL.createObjectURL(xhr.response);
        const a = document.createElement("a");
        a.href = url;
        a.download = "converted.docx";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } else {
        alert("Conversion failed");
      }
    };

    xhr.onerror = () => {
      alert("Request failed");
    };

    xhr.send(formData);
  });
});
</script>

</body>
</html>
