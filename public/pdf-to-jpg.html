<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF to JPG - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=400" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="mobile-header">
  <button class="mobile-menu-btn" id="toolsMenuBtn" type="button">☰</button>
  <a href="/index.html" class="mobile-logo">HelloPDF</a>
  <button class="mobile-grid-btn" id="mainMenuBtn" type="button">⠿</button>
</header>

<section class="tool-page">
  <div class="tool-box">

    <div class="tool-icon">
      <i class="fa-solid fa-file-image" style="color:#f97316;font-size:55px;"></i>
    </div>

    <h1>PDF to JPG</h1>

    <p class="tool-description">
      Convert PDF pages into high quality JPG images.
    </p>

    <div style="margin-top:35px;">
      <span style="
        background:#f59e0b;
        color:white;
        padding:10px 20px;
        border-radius:999px;
        font-weight:700;
        font-size:15px;
      ">
        🚀 Coming Soon
      </span>
    </div>

    <p style="
      margin-top:25px;
      color:#64748b;
      line-height:1.8;
      font-size:15px;
      max-width:550px;
      margin-left:auto;
      margin-right:auto;
    ">
      This tool requires advanced image rendering processing and is currently being optimized for cloud deployment.
      It will be available soon with high quality JPG conversion support.
    </p>

  </div>
</section>

<script>
  const toolsBtn = document.getElementById("toolsMenuBtn");
  const mainBtn = document.getElementById("mainMenuBtn");
  const toolsDrawer = document.getElementById("toolsDrawer");
  const mainDrawer = document.getElementById("mainDrawer");
  const overlay = document.getElementById("drawerOverlay");

  if (toolsBtn && mainBtn && toolsDrawer && mainDrawer && overlay) {
    function closeDrawers() {
      toolsDrawer.classList.remove("active");
      mainDrawer.classList.remove("active");
      overlay.classList.remove("active");
    }

    toolsBtn.addEventListener("click", () => {
      toolsDrawer.classList.add("active");
      overlay.classList.add("active");
    });

    mainBtn.addEventListener("click", () => {
      mainDrawer.classList.add("active");
      overlay.classList.add("active");
    });
  }
</script>

</body>
</html>
