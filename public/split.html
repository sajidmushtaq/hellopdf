<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split PDF - PDFToolsPro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->


  

</header>

<!-- TOOL PAGE -->
<section class="tool-page">

  <div class="tool-box">

    <h1>✂ Split PDF</h1>
    <p>Split one PDF into multiple separate PDF files easily and securely.</p>

    <form id="uploadForm">

      <div class="drop-zone" id="dropZone">
        <p>Click or Drag PDF Here</p>
        <input
          type="file"
          id="fileInput"
          accept="application/pdf"
          hidden
        >
      </div>

      <div id="fileList"></div>

      <button type="submit">Split PDF</button>

    </form>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>

  </div>

</section>

<footer class="footer">
  <p>© 2026 PDFToolsPro — Professional PDF Solutions</p>
</footer>

<script src="js/split.js"></script>

</html>
