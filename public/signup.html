<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign Up - HelloPDF</title>

  <link rel="stylesheet" href="/css/style.css?v=501" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card" id="signupCard">
      <a href="/index.html" class="auth-logo">HelloPDF</a>

      <h1>Create account</h1>
      <p>Sign up to access your HelloPDF tools.</p>
      <div class="social-auth">
  <button type="button" class="social-btn google-btn" id="googleSignupBtn">
    <i class="fa-brands fa-google"></i>
    Continue with Google
  </button>

  <button type="button" class="social-btn facebook-btn" id="facebookSignupBtn">
    <i class="fa-brands fa-facebook-f"></i>
    Continue with Facebook
  </button>

  <div class="auth-divider">
    <span>OR</span>
  </div>
</div>
      <form class="auth-form" id="signupForm">
        <input type="text" id="fullName" placeholder="Full name" required />
        <input type="email" id="signupEmail" placeholder="Email address" required />
        <input type="password" id="signupPassword" placeholder="Password" required />

        <button type="submit" id="signupBtn">Sign Up</button>
      </form>

      <p id="authMessage" style="margin-top:14px;font-size:14px;"></p>

      <p class="auth-switch">
        Already have an account?
        <a href="/login.html">Login</a>
      </p>
    </div>

    <div class="auth-card" id="successCard" style="display:none;">
      <a href="/index.html" class="auth-logo">HelloPDF</a>

      <div style="
        width:110px;
        height:110px;
        border:6px solid #22c55e;
        border-radius:50%;
        margin:20px auto 28px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#22c55e;
        font-size:58px;
        font-weight:700;
      ">
        ✓
      </div>

      <h1>You have been successfully registered</h1>
      <p id="welcomeText">Welcome to HelloPDF!</p>

      <a href="/index.html" style="
        display:inline-block;
        margin-top:22px;
        background:#ef4444;
        color:white;
        padding:14px 24px;
        border-radius:9px;
        text-decoration:none;
        font-weight:800;
      ">
        Start using HelloPDF
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://vfpgxiepllmkfkdtyjws.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0NR6JL7RbGq9hHQMXCUbzA_MSU2Vh1T";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const signupForm = document.getElementById("signupForm");
    const authMessage = document.getElementById("authMessage");
    const signupBtn = document.getElementById("signupBtn");
    const signupCard = document.getElementById("signupCard");
    const successCard = document.getElementById("successCard");
    const welcomeText = document.getElementById("welcomeText");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();

      authMessage.style.color = "#64748b";
      authMessage.textContent = "Creating account...";
      signupBtn.disabled = true;
      signupBtn.textContent = "Please wait...";

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });

      signupBtn.disabled = false;
      signupBtn.textContent = "Sign Up";

      if (error) {
        authMessage.style.color = "#ef4444";
        authMessage.textContent = error.message;
        return;
      }

      welcomeText.textContent = "Welcome to HelloPDF, " + fullName + "!";
      signupCard.style.display = "none";
      successCard.style.display = "block";
localStorage.setItem("hellopdf_user_email", email);
localStorage.setItem("hellopdf_user_name", fullName);

setTimeout(() => {
  window.location.href = "/index.html";
}, 1800);
    });
const googleSignupBtn = document.getElementById("googleSignupBtn");
const facebookSignupBtn = document.getElementById("facebookSignupBtn");

googleSignupBtn.addEventListener("click", async () => {

  await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/index.html"
    }
  });

});

facebookSignupBtn.addEventListener("click", async () => {

  await supabaseClient.auth.signInWithOAuth({
    provider: "facebook",
    options: {
      redirectTo: window.location.origin + "/index.html"
    }
  });

});
  </script>

</body>
</html>
